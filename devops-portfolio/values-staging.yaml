global:
  environment: staging
  namespace: staging
backend:
  replicas: 1
  image:
    repository: LautiBD/devops-portfolio
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"
frontend:
  replicas: 1
  resources:
    requests:
      memory: "32Mi"
      cpu: "25m"
    limits:
      memory: "64Mi"
      cpu: "100m"
postgres:
  storage:
    size: 1Gi
  credentials:
    database: notesdb_staging
    user: postgres
    password: "staging-secret-password-2026"
ingress:
  enabled: true
  className: nginx
  host: staging.devops-portfolio.local
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
hpa:
  enabled: false
